version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ohive-postgres
    restart: always
    environment:
      POSTGRES_DB: ohive_db
      POSTGRES_USER: ohive_user
      POSTGRES_PASSWORD: ohive_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ohive_user -d ohive_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ohive-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - APP_ENV=production
      - DATABASE_URL=postgresql+psycopg://ohive_user:ohive_password@db:5432/ohive_db
      - VLM_PROVIDER=hosted
      - VLM_MODEL_NAME=qwen/qwen-2.5-vl-72b-instruct:free
      - CORS_ORIGINS=http://localhost:3000,https://ohive-lead-extractor.vercel.app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ohive-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
