[build]
  command = "npm run build --prefix frontend"
  publish = "frontend/.next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/api/v1/*"
  to = "https://ohive-backend.onrender.com/api/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://ohive-backend.onrender.com/health"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 200
